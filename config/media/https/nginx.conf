worker_processes 1;
pid /srv/rack-ai-media/https/run/nginx.pid;
error_log /srv/rack-ai-media/https/logs/nginx-error.log warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /srv/rack-ai-media/https/run/client-body;
    proxy_temp_path /srv/rack-ai-media/https/run/proxy;
    fastcgi_temp_path /srv/rack-ai-media/https/run/fastcgi;
    uwsgi_temp_path /srv/rack-ai-media/https/run/uwsgi;
    scgi_temp_path /srv/rack-ai-media/https/run/scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        include /srv/rack-ai-media/https/config/listen.conf;
        server_name gpurack.duckdns.org;
        if ($host != "gpurack.duckdns.org") { return 444; }
        ssl_certificate /srv/rack-ai-media/https/acme/certbot/live/gpurack.duckdns.org/fullchain.pem;
        ssl_certificate_key /srv/rack-ai-media/https/acme/certbot/live/gpurack.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_timeout 10m;
        location / {
            proxy_pass http://127.0.0.1:8191;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }
        # GPU Rack service selector (shared bridge admin UI)
        # Authenticated proxy for control endpoints only.
        location /bridge/control/ {
            proxy_pass http://127.0.0.1:18099$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:18099;
            proxy_read_timeout 15s;
        }
        # Static page served directly from the bridge (no privileged headers).
        location /bridge/ {
            proxy_pass http://127.0.0.1:18098/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
