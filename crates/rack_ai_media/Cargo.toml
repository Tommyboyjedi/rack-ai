[package]
name = "rack_ai_media"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rack_ai_application = { path = "../rack_ai_application" }
rack_ai_infrastructure = { path = "../rack_ai_infrastructure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws", "form"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["timeout", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
sha2 = "0.10"
subtle = "2"
futures-util = "0.3"
tokio-tungstenite = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4", "serde"] }

serde_urlencoded = "0.7"
quick-xml = { version = "0.42", features = ["serialize"] }
argon2 = { version = "0.5.3", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
