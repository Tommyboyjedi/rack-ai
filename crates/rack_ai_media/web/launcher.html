<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Rack AI · ComfyUI</title><style>body{font:18px system-ui;max-width:48rem;margin:8vh auto;padding:2rem;background:#101923;color:#e5f2ff}button,a{font:inherit;padding:.7rem 1rem;margin:.3rem;border-radius:.4rem}button{cursor:pointer}a{display:inline-block;color:#96d6ff}button:disabled{opacity:.5}#state{font-size:1.4rem}#error{color:#ffc19b}</style>
<h1>ComfyUI on the rack</h1><p id="state" role="status">Connecting…</p><p id="error" role="alert"></p>
<button id="start" disabled>Start ComfyUI</button><a id="open" hidden target="_blank" rel="noopener">Open ComfyUI</a><button id="finish" disabled>Finish session</button>
<p>Finish closes admission and lets accepted work drain before releasing the GPU. Closing this page leaves your session running.</p>
<script>
const api='/api/media/v1';let session=null,busy=false;
const state=document.querySelector('#state'),error=document.querySelector('#error'),start=document.querySelector('#start'),finish=document.querySelector('#finish'),open=document.querySelector('#open');
async function call(path,body){const r=await fetch(api+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(r.status===401){location.href='/login';throw Error('Sign in required');}const data=await r.json();if(!r.ok)throw Error(data.error?.message||'Request failed');return data;}
async function refresh(){try{const status=await call('/status');session=status.session_id;let detail=session?await call('/sessions/'+session):null;state.textContent=(detail?.state||status.state).replaceAll('_',' ');error.textContent=status.message||'';start.disabled=busy||!!session||status.state==='recovery_required';finish.disabled=busy||!session||detail?.release_requested;open.hidden=!detail?.access_url;if(detail?.access_url)open.href=detail.access_url;if(!session&&!busy&&status.state==='stopped')sessionStorage.removeItem('rack-start-key');}catch(e){error.textContent=e.message;}}
start.onclick=async()=>{busy=true;start.disabled=true;try{let key=sessionStorage.getItem('rack-start-key');if(!key){key=crypto.randomUUID();sessionStorage.setItem('rack-start-key',key);}const s=await call('/sessions',{schema:'rack-ai/media/v1',idempotency_key:key});session=s.id;}catch(e){error.textContent=e.message;}finally{busy=false;refresh();}};
finish.onclick=async()=>{busy=true;finish.disabled=true;try{await call('/sessions/'+session+'/release',{});}catch(e){error.textContent=e.message;}finally{busy=false;refresh();}};
refresh();setInterval(refresh,2000);
</script></html>
