<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Rack AI account</title><style>body{font:18px system-ui;max-width:38rem;margin:6vh auto;padding:2rem;background:#101923;color:#e5f2ff}input,button{font:inherit;padding:.7rem;margin:.5rem 0;box-sizing:border-box;border-radius:.4rem}input{width:100%}label{display:block;margin-top:1rem}button{cursor:pointer}a{color:#96d6ff}#error{color:#ffc19b}#saved{color:#a9efbb}[hidden]{display:none!important}</style>
<a href="/">Back to ComfyUI</a><h1>{{password_action}}</h1><p>{{bootstrap_note}}</p>
<p id="saved" role="status" hidden>Password saved. Other browser sessions have been signed out.</p>
<form id="password-form" method="post" action="/account">
<label>Current password<input type="password" name="current_password" autocomplete="current-password" maxlength="1024" required></label>
<label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
<label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
<p>Use at least 12 characters. A memorable passphrase works well.</p><button>Save password</button></form>
<p id="error" role="alert"></p><form method="post" action="/logout"><button>Log out</button></form>
<script>
document.querySelector('#saved').hidden=new URLSearchParams(location.search).get('saved')!=='1';
const form=document.querySelector('#password-form'),error=document.querySelector('#error'),button=form.querySelector('button');
form.onsubmit=async event=>{event.preventDefault();button.disabled=true;error.textContent='';try{const response=await fetch(form.action,{method:'POST',body:new URLSearchParams(new FormData(form)),redirect:'manual'});if(response.type==='opaqueredirect'){location.assign('/account?saved=1');return;}error.textContent=await response.text()||'Password could not be changed. Please try again.';}catch{error.textContent='Could not connect. Please try again.';}finally{button.disabled=false;}};
</script></html>
